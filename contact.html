<main id="main">
<div class="container">
  <header class="page-head">
    <p class="kicker">Contact</p>
    <h1>Let's work together.</h1>
    <p class="lede">Have a project in mind? Send me a message and I will reply by email.</p>
  </header>
</div>
<section class="container">
  <div class="contact-grid">
    <form class="form" id="contact-form" action="https://formspree.io/f/xgaaayvg" method="POST" novalidate>
      <div class="form__row">
        <div class="field"><label for="name">Name <span class="req" aria-hidden="true">*</span></label><input type="text" id="name" name="name" autocomplete="name" required aria-required="true" aria-describedby="error-name" maxlength="100"><p class="field__error" id="error-name"></p></div>
        <div class="field"><label for="email">Email <span class="req" aria-hidden="true">*</span></label><input type="email" id="email" name="email" autocomplete="email" required aria-required="true" aria-describedby="error-email" maxlength="254"><p class="field__error" id="error-email"></p></div>
      </div>
      <div class="field"><label for="subject">Subject <span class="req" aria-hidden="true">*</span></label><input type="text" id="subject" name="subject" required aria-required="true" aria-describedby="error-subject" maxlength="150"><p class="field__error" id="error-subject"></p></div>
      <div class="field"><label for="message">Message <span class="req" aria-hidden="true">*</span></label><textarea id="message" name="message" rows="6" required aria-required="true" aria-describedby="error-message message-count" maxlength="2000"></textarea><p class="field__error" id="error-message"></p><p class="field__hint" id="message-count">0 / 2000</p></div>
      <div class="hp" aria-hidden="true"><label>Leave this field empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
      <div><button type="submit" class="btn btn--primary">Send message</button></div>
      <div class="form-status" id="form-status" role="status" aria-live="polite" hidden></div>
    </form>
    <aside class="info-panel" aria-labelledby="direct-h">
      <p class="status-pill">Available for work</p>
      <h2 id="direct-h">Reach me directly</h2>
      <dl>
        <dt>Email</dt><dd data-site="email"></dd>
        <dt>Phone</dt><dd data-site="phone"></dd>
        <dt>Location</dt><dd data-site="location">Calamba, Laguna, Philippines</dd>
      </dl>
      <div data-socials></div>
    </aside>
  </div>
</section>
